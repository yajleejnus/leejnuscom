<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔤 Word Match — Hmong Language Games</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hmong+Nyiakeng:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .game-container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
    .game-header { text-align: center; margin-bottom: 30px; }
    .game-header h1 { color: var(--color-hmong-red); }
    .score-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.1rem; }
    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .match-card {
      padding: 20px 16px; border: 2px solid #ccc; background: white;
      border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: 600;
      text-align: center; transition: all 0.2s; user-select: none;
    }
    .match-card:hover { border-color: var(--color-hmong-red); }
    .match-card.selected { border-color: var(--color-hmong-red); background: #fef2f2; box-shadow: 0 0 0 2px rgba(200,30,30,0.2); }
    .match-card.matched { border-color: #22c55e; background: #f0fdf4; opacity: 0.7; pointer-events: none; }
    .match-card.wrong { border-color: #ef4444; background: #fef2f2; animation: shake 0.4s; }
    .match-card.hmong { color: var(--color-hmong-red); }
    .match-card.english { color: var(--color-dark); }
    .feedback { text-align: center; font-size: 1.2rem; min-height: 30px; margin: 16px 0; }
    .game-nav { text-align: center; margin-top: 20px; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @media (max-width: 500px) {
      .match-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>
  <div class="hmong-border"></div>
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Hmong<span>Heritage</span></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">🏠 Home</a></li>
        <li><a href="../language/index.html">📖 Language</a></li>
        <li><a href="../culture/index.html">🎭 Culture</a></li>
        <li><a href="../about/index.html">👥 About</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="game-container">
    <div class="game-header">
      <h1>🔤 Word Match</h1>
      <p>Tap a Hmong word, then tap its English meaning</p>
    </div>
    <div class="score-bar">
      <span>Score: <strong id="score">0</strong></span>
      <span>Matched: <strong id="matched">0</strong> / <strong id="total">0</strong></span>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="match-grid" id="matchGrid"></div>
    <div class="game-nav">
      <button class="btn btn-primary" id="newGameBtn" style="display:none;" onclick="newGame()">New Game 🔄</button>
    </div>
  </div>

  <div class="hmong-border-thick"></div>
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand"><h3>Hmong<span>Heritage</span></h3></div>
      <div class="footer-links"><h4>Resources</h4><ul>
        <li><a href="https://www.hmongdictionary.org/" target="_blank" rel="noopener">Hmong Dictionary</a></li>
        <li><a href="https://www.hmonglanguage.com/pronunciation-guide/" target="_blank" rel="noopener">Pronunciation Guide</a></li>
        <li><a href="https://www.hmong.org/" target="_blank" rel="noopener">Community Links</a></li>
      </ul></div>
    </div>
    <div class="footer-bottom"><p>© 2026 HmongHeritage</p></div>
  </footer>
  <div class="hmong-border"></div>

  <script>
    const pairs = [
      { hmong: 'nyuj', english: 'dog' },
      { hmong: 'daj', english: 'tall' },
      { hmong: 'siab', english: 'heart' },
      { hmong: 'pom', english: 'see' },
      { hmong: 'noog', english: 'listen' },
      { hmong: 'hu', english: 'call' },
      { hmong: 'lus', english: 'word' },
      { hmong: 'hmoob', english: 'Hmong' },
      { hmong: 'dav', english: 'east' },
      { hmong: 'taub', english: 'open' },
      { hmong: 'tsis', english: 'not' },
      { hmong: 'huas', english: 'big' },
      { hmong: 'dab', english: 'spirit' },
      { hmong: 'tsob', english: 'classifier (plants)' },
      { hmong: 'huab', english: 'cloud' },
      { hmong: 'ntuj', english: 'sky' },
      { hmong: 'hau', english: 'in' },
      { hmong: 'tug', english: 'classifier (animals)' },
      { hmong: 'nyuaj', english: 'difficult' },
      { hmong: 'twg', english: 'who' }
    ];

    let selected = null, score = 0, matchedPairs = [], gamePairs = [];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function newGame() {
      gamePairs = shuffle(pairs).slice(0, 6);
      matchedPairs = [];
      selected = null;
      score = 0;
      document.getElementById('score').textContent = '0';
      document.getElementById('feedback').textContent = '';
      document.getElementById('newGameBtn').style.display = 'none';

      const hmongCards = shuffle(gamePairs.map((p, i) => ({ text: p.hmong, pairIdx: i, type: 'hmong' })));
      const englishCards = shuffle(gamePairs.map((p, i) => ({ text: p.english, pairIdx: i, type: 'english' })));

      const grid = document.getElementById('matchGrid');
      grid.innerHTML = '';
      // Interleave
      const interleaved = [];
      for (let i = 0; i < Math.max(hmongCards.length, englishCards.length); i++) {
        if (hmongCards[i]) interleaved.push(hmongCards[i]);
        if (englishCards[i]) interleaved.push(englishCards[i]);
      }
      // Shuffle again
      const final = shuffle(interleaved);

      document.getElementById('total').textContent = gamePairs.length;
      document.getElementById('matched').textContent = '0';

      final.forEach(card => {
        const div = document.createElement('div');
        div.className = `match-card ${card.type}`;
        div.textContent = card.text;
        div.dataset.pairIdx = card.pairIdx;
        div.dataset.type = card.type;
        div.onclick = () => selectCard(div);
        grid.appendChild(div);
      });
    }

    function selectCard(el) {
      if (el.classList.contains('matched')) return;

      if (!selected) {
        selected = el;
        el.classList.add('selected');
        return;
      }

      if (selected === el) {
        selected.classList.remove('selected');
        selected = null;
        return;
      }

      // Must be different types
      if (selected.dataset.type === el.dataset.type) {
        selected.classList.remove('selected');
        selected = el;
        el.classList.add('selected');
        return;
      }

      if (selected.dataset.pairIdx === el.dataset.pairIdx) {
        // Match!
        selected.classList.remove('selected');
        selected.classList.add('matched');
        el.classList.add('matched');
        score += 10;
        matchedPairs.push(selected.dataset.pairIdx);
        document.getElementById('score').textContent = score;
        document.getElementById('matched').textContent = matchedPairs.length;
        document.getElementById('feedback').innerHTML = '<span style="color:#22c55e">✅ Match!</span>';
        selected = null;

        if (matchedPairs.length === gamePairs.length) {
          document.getElementById('feedback').innerHTML = `<span style="color:#22c55e">🎉 All matched! Score: ${score}</span>`;
          document.getElementById('newGameBtn').style.display = 'inline-block';
        }
      } else {
        el.classList.add('wrong');
        selected.classList.add('wrong');
        document.getElementById('feedback').innerHTML = '<span style="color:#ef4444">❌ Try again</span>';
        const prev = selected;
        setTimeout(() => {
          el.classList.remove('wrong');
          prev.classList.remove('wrong', 'selected');
          selected = null;
          document.getElementById('feedback').textContent = '';
        }, 600);
      }
    }

    newGame();
  </script>
</body>
</html>
