<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 Animal Quiz — Hmong Language Games</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hmong+Nyiakeng:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .game-container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
    .game-header { text-align: center; margin-bottom: 30px; }
    .game-header h1 { color: var(--color-hmong-red); }
    .score-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.1rem; }
    .animal-display { text-align: center; padding: 40px; background: var(--color-cream); border-radius: 12px; margin-bottom: 24px; }
    .animal-icon { font-size: 5rem; margin-bottom: 12px; }
    .animal-hmong { font-size: 2rem; font-weight: 700; color: var(--color-hmong-red); }
    .animal-hint { font-size: 0.95rem; opacity: 0.6; }
    .animal-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .animal-btn {
      padding: 18px 12px; border: 2px solid #ccc; background: white; border-radius: 8px;
      cursor: pointer; font-size: 1rem; text-align: center; transition: all 0.2s;
    }
    .animal-btn:hover { border-color: var(--color-hmong-red); }
    .animal-btn.correct { background: #22c55e; border-color: #22c55e; color: white; }
    .animal-btn.wrong { background: #ef4444; border-color: #ef4444; color: white; }
    .animal-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .feedback { text-align: center; font-size: 1.2rem; min-height: 30px; margin-bottom: 16px; }
    @media (max-width: 500px) { .animal-options { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>
  <div class="hmong-border"></div>
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Hmong<span>Heritage</span></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">🏠 Home</a></li>
        <li><a href="../language/index.html">📖 Language</a></li>
        <li><a href="../culture/index.html">🎭 Culture</a></li>
        <li><a href="../about/index.html">👥 About</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="game-container">
    <div class="game-header"><h1>🐾 Animal Quiz</h1><p>What animal is this in Hmong?</p></div>
    <div class="score-bar"><span>Score: <strong id="score">0</strong></span><span>Round: <strong id="round">1</strong></span></div>
    <div class="animal-display">
      <div class="animal-icon" id="animalIcon">🐾</div>
      <div class="animal-hmong" id="animalHmong">...</div>
      <div class="animal-hint" id="animalHint">...</div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="animal-options" id="animalOptions"></div>
  </div>

  <div class="hmong-border-thick"></div>
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand"><h3>Hmong<span>Heritage</span></h3></div>
      <div class="footer-links"><h4>Resources</h4><ul>
        <li><a href="https://www.hmongdictionary.org/" target="_blank" rel="noopener">Hmong Dictionary</a></li>
        <li><a href="https://www.hmonglanguage.com/pronunciation-guide/" target="_blank" rel="noopener">Pronunciation Guide</a></li>
        <li><a href="https://www.hmong.org/" target="_blank" rel="noopener">Community Links</a></li>
      </ul></div>
    </div>
    <div class="footer-bottom"><p>© 2026 HmongHeritage</p></div>
  </footer>
  <div class="hmong-border"></div>

  <script>
    const animals = [
      { english: 'Dog', hmong: 'nyuj', icon: '🐕' },
      { english: 'Cat', hmong: 'vaj', icon: '🐈' },
      { english: 'Chicken', hmong: 'laum', icon: '🐔' },
      { english: 'Pig', hmong: 'hmoov', icon: '🐷' },
      { english: 'Buffalo', hmong: 'tsov', icon: '🐃' },
      { english: 'Fish', hmong: 'plaw', icon: '🐟' },
      { english: 'Bird', hmong: 'ntuj', icon: '🐦' },
      { english: 'Snake', hmong: 'hmoob', icon: '🐍' },
      { english: 'Tiger', hmong: 'tsov', icon: '🐅' },
      { english: 'Monkey', hmong: 'ntaj', icon: '🐒' },
      { english: 'Elephant', hmong: 'hu', icon: '🐘' },
      { english: 'Deer', hmong: 'hwj', icon: '🦌' },
      { english: 'Rabbit', hmong: 'nraug', icon: '🐇' },
      { english: 'Cow', hmong: 'hmoob', icon: '🐄' },
      { english: 'Goat', hmong: 'ntshuav', icon: '🐐' },
      { english: 'Horse', hmong: 'hmoob', icon: '🐴' },
      { english: 'Duck', hmong: 'laum', icon: '🦆' },
      { english: 'Frog', hmong: 'plaw', icon: '🐸' },
      { english: 'Butterfly', hmong: 'hmoob', icon: '🦋' },
      { english: 'Ant', hmong: 'hmoob', icon: '🐜' }
    ];

    let score = 0, round = 1, current = null, totalRounds = 10;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function loadAnimal() {
      if (round > totalRounds) {
        document.querySelector('.animal-display').innerHTML = `<div class="animal-icon">🎉</div><div class="animal-hmong">Final score: ${score}/${totalRounds * 10}</div>`;
        document.getElementById('animalOptions').innerHTML = '<button class="btn btn-primary" onclick="location.reload()">Play Again</button>';
        return;
      }

      current = animals[Math.floor(Math.random() * animals.length)];
      document.getElementById('animalIcon').textContent = current.icon;
      document.getElementById('animalHmong').textContent = current.english;
      document.getElementById('animalHint').textContent = `Choose the Hmong word`;
      document.getElementById('feedback').textContent = '';

      const wrong = shuffle(animals.filter(a => a.hmong !== current.hmong || a.english !== current.english)).slice(0, 3).map(a => a.hmong);
      const uniqueWrong = [...new Set(wrong)].slice(0, 3);
      const options = shuffle([current.hmong, ...uniqueWrong]);

      const container = document.getElementById('animalOptions');
      container.innerHTML = '';
      options.forEach(h => {
        const btn = document.createElement('button');
        btn.className = 'animal-btn';
        btn.textContent = h;
        btn.onclick = () => checkAnimal(h, btn);
        container.appendChild(btn);
      });
    }

    function checkAnimal(selected, btn) {
      const allBtns = document.querySelectorAll('.animal-btn');
      allBtns.forEach(b => b.disabled = true);

      if (selected === current.hmong) {
        btn.classList.add('correct');
        document.getElementById('feedback').innerHTML = `<span style="color:#22c55e">✅ "${current.hmong}"!</span>`;
        score += 10;
      } else {
        btn.classList.add('wrong');
        allBtns.forEach(b => { if (b.textContent === current.hmong) b.classList.add('correct'); });
        document.getElementById('feedback').innerHTML = `<span style="color:#ef4444">❌ It was "${current.hmong}"</span>`;
      }

      document.getElementById('score').textContent = score;
      round++;
      document.getElementById('round').textContent = round;
      setTimeout(loadAnimal, 1200);
    }

    loadAnimal();
  </script>
</body>
</html>
