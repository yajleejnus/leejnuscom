<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%87%B8%F0%9F%87%B2%3C/text%3E%3C/svg%3E">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌤️ Weather — Hmong Language Games</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hmong+Nyiakeng:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .game-container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
    .game-header { text-align: center; margin-bottom: 30px; }
    .game-header h1 { color: var(--color-hmong-red); }
    .score-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.1rem; }
    .weather-card {
      text-align: center; padding: 40px; background: var(--color-cream); border-radius: 12px;
      margin-bottom: 24px; border: 2px solid var(--color-hmong-red);
    }
    .weather-icon { font-size: 5rem; margin-bottom: 12px; }
    .weather-hmong { font-size: 2rem; font-weight: 700; color: var(--color-hmong-red); }
    .weather-hint { font-size: 0.95rem; opacity: 0.6; }
    .weather-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .weather-btn {
      padding: 18px 12px; border: 2px solid #ccc; background: white; border-radius: 8px;
      cursor: pointer; font-size: 1rem; text-align: center; transition: all 0.2s;
    }
    .weather-btn:hover { border-color: var(--color-hmong-red); }
    .weather-btn.correct { background: #22c55e; border-color: #22c55e; color: white; }
    .weather-btn.wrong { background: #ef4444; border-color: #ef4444; color: white; }
    .weather-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .feedback { text-align: center; font-size: 1.2rem; min-height: 30px; margin-bottom: 16px; }
    @media (max-width: 500px) { .weather-options { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>
  <div class="hmong-border"></div>
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Hmong<span>Heritage</span></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">🏠 Home</a></li>
        <li><a href="../language/index.html">📖 Language</a></li>
        <li><a href="../culture/index.html">🎭 Culture</a></li>
        <li><a href="../about/index.html">👥 About</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="game-container">
    <div class="game-header"><h1>🌤️ Weather</h1><p>What weather condition is this in Hmong?</p></div>
    <div class="score-bar"><span>Score: <strong id="score">0</strong></span><span>Round: <strong id="round">1</strong></span></div>
    <div class="weather-card">
      <div class="weather-icon" id="weatherIcon">🌤️</div>
      <div class="weather-hmong" id="weatherHmong">...</div>
      <div class="weather-hint" id="weatherHint">Choose the Hmong word</div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="weather-options" id="weatherOptions"></div>
  </div>

  <div class="hmong-border-thick"></div>
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand"><h3>Hmong<span>Heritage</span></h3></div>
      <div class="footer-links"><h4>Resources</h4><ul>
        <li><a href="https://www.hmongdictionary.org/" target="_blank" rel="noopener">Hmong Dictionary</a></li>
        <li><a href="https://www.hmonglanguage.com/pronunciation-guide/" target="_blank" rel="noopener">Pronunciation Guide</a></li>
        <li><a href="https://www.hmong.org/" target="_blank" rel="noopener">Community Links</a></li>
      </ul></div>
    </div>
    <div class="footer-bottom"><p>© 2026 HmongHeritage</p></div>
  </footer>
  <div class="hmong-border"></div>

  <script>
    const weather = [
      { english: 'Sunny', hmong: 'hawv', icon: '☀️' },
      { english: 'Rainy', hmong: 'hawv', icon: '🌧️' },
      { english: 'Cloudy', hmong: 'huab', icon: '☁️' },
      { english: 'Windy', hmong: 'hawv', icon: '💨' },
      { english: 'Cold', hmong: 'nplua', icon: '🥶' },
      { english: 'Hot', hmong: 'hawv', icon: '🥵' },
      { english: 'Snow', hmong: 'nplua', icon: '❄️' },
      { english: 'Foggy', hmong: 'huab', icon: '🌫️' },
      { english: 'Thunder', hmong: 'hawv', icon: '⛈️' },
      { english: 'Lightning', hmong: 'hawv', icon: '🌩️' },
      { english: 'Storm', hmong: 'hawv', icon: '🌪️' },
      { english: 'Drizzle', hmong: 'hawv', icon: '🌦️' },
      { english: 'Humid', hmong: 'nplua', icon: '💦' },
      { english: 'Dry', hmong: 'hawv', icon: '🏜️' },
      { english: 'Rainbow', hmong: 'huab', icon: '🌈' }
    ];

    let score = 0, round = 1, current = null, totalRounds = 10;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function loadWeather() {
      if (round > totalRounds) {
        document.querySelector('.weather-card').innerHTML = `<div class="weather-icon">🎉</div><div class="weather-hmong">Final score: ${score}/${totalRounds * 10}</div>`;
        document.getElementById('weatherOptions').innerHTML = '<button class="btn btn-primary" onclick="location.reload()">Play Again</button>';
        return;
      }

      current = weather[Math.floor(Math.random() * weather.length)];
      document.getElementById('weatherIcon').textContent = current.icon;
      document.getElementById('weatherHmong').textContent = current.english;
      document.getElementById('weatherHint').textContent = 'Choose the Hmong word';
      document.getElementById('feedback').textContent = '';

      const wrong = shuffle(weather.filter(w => w.hmong !== current.hmong)).slice(0, 3).map(w => w.hmong);
      const uniqueWrong = [...new Set(wrong)].slice(0, 3);
      const options = shuffle([current.hmong, ...uniqueWrong]);

      const container = document.getElementById('weatherOptions');
      container.innerHTML = '';
      options.forEach(h => {
        const btn = document.createElement('button');
        btn.className = 'weather-btn';
        btn.textContent = h;
        btn.onclick = () => checkWeather(h, btn);
        container.appendChild(btn);
      });
    }

    function checkWeather(selected, btn) {
      const allBtns = document.querySelectorAll('.weather-btn');
      allBtns.forEach(b => b.disabled = true);

      if (selected === current.hmong) {
        btn.classList.add('correct');
        document.getElementById('feedback').innerHTML = `<span style="color:#22c55e">✅ "${current.hmong}"!</span>`;
        score += 10;
      } else {
        btn.classList.add('wrong');
        allBtns.forEach(b => { if (b.textContent === current.hmong) b.classList.add('correct'); });
        document.getElementById('feedback').innerHTML = `<span style="color:#ef4444">❌ It was "${current.hmong}"</span>`;
      }

      document.getElementById('score').textContent = score;
      round++;
      document.getElementById('round').textContent = round;
      setTimeout(loadWeather, 1200);
    }

    loadWeather();
  </script>
</body>
</html>
