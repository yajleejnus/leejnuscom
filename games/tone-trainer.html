<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎯%3C/text%3E%3C/svg%3E">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 Tone Trainer Pro — Hmong Language Games</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hmong+Nyiakeng:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel=\"stylesheet\">
  <style>
    :root {
      --game-bg: #f8fafc;
      --game-accent: var(--color-primary);
    }
    body.dark-mode {
      --game-bg: #0f172a;
    }
    .game-layout { 
      max-width: 800px; 
      margin: 0 auto; 
      padding: 60px 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    .game-header { 
      text-align: center; 
      margin-bottom: 40px; 
    }
    .game-header h1 { 
      font-family: var(--font-heading);
      font-size: 3rem;
      color: var(--color-primary); 
      margin-bottom: 10px;
    }
    .stats-container { 
      display: flex; 
      gap: 20px; 
      margin-bottom: 30px; 
      background: white; 
      padding: 15px 30px; 
      border-radius: 50px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 2px solid var(--color-secondary);
      font-weight: 600;
    }
    body.dark-mode .stats-container {
      background: var(--color-dark-surface);
      color: white;
      border-color: var(--color-secondary);
    }
    .word-card { 
      width: 100%;
      max-width: 500px;
      text-align: center; 
      padding: 60px 40px; 
      background: white; 
      border-radius: 24px; 
      margin-bottom: 30px; 
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      border-bottom: 8px solid var(--color-primary);
    }
    body.dark-mode .word-card {
      background: var(--color-dark-surface);
      color: white;
    }
    .hmong-word { 
      font-family: 'Noto Sans Hmong Nyiakeng', serif;
      font-size: 4rem; 
      font-weight: 700; 
      color: var(--color-dark); 
      margin-bottom: 10px; 
      transition: transform 0.2s ease;
    }
    body.dark-mode .hmong-word { color: white; }
    .english-hint { 
      font-size: 1.4rem; 
      opacity: 0.6; 
      font-style: italic;
    }
    .options-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 15px; 
      width: 100%;
      max-width: 600px;
    }
    .tone-btn {
      padding: 20px 10px; 
      border: 2px solid #e2e8f0; 
      background: white;
      border-radius: 16px; 
      cursor: pointer; 
      font-weight: 600;
      transition: all 0.2s; 
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    body.dark-mode .tone-btn {
      background: var(--color-dark-bg);
      border-color: #334155;
      color: #cbd5e1;
    }
    .tone-btn:hover { 
      transform: translateY(-3px);
      border-color: var(--color-primary);
      background: #fffafa;
    }
    body.dark-mode .tone-btn:hover {
      background: #1e293b;
      border-color: var(--color-secondary);
    }
    .tone-btn.correct { 
      background: #22c55e !important; 
      border-color: #16a34a !important; 
      color: white !important; 
      animation: pop 0.3s ease-in-out;
    }
    .tone-btn.wrong { 
      background: #ef4444 !important; 
      border-color: #dc2626 !important; 
      color: white !important; 
      animation: shake 0.3s ease-in-out;
    }
    .tone-label { font-size: 1.2rem; font-weight: 700; }
    .tone-desc { font-size: 0.8rem; opacity: 0.7; font-weight: 400; }
    .feedback-area { 
      height: 40px; 
      text-align: center; 
      font-size: 1.3rem; 
      font-weight: 600; 
      margin: 20px 0; 
    }
    .next-btn { 
      padding: 15px 40px; 
      font-size: 1.2rem; 
      border-radius: 50px; 
      cursor: pointer; 
      display: none;
    }
    .progress-bar-container {
      width: 100%;
      max-width: 600px;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-bottom: 40px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--color-secondary);
      width: 0%;
      transition: width 0.4s ease;
    }
    body.dark-mode .progress-bar-container { background: #334155; }
  </style>
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>
  <div class="hmong-border"></div>
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Hmong<span>Heritage</span></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">🏠 Home</a></li>
        <li><a href="../language/index.html">📖 Language</a></li>
        <li><a href="../culture/index.html">🎭 Culture</a></li>
        <li><a href="../about/index.html">👥 About</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="game-layout">
    <div class="game-header">
      <h1>🎯 Tone Trainer Pro</h1>
      <p>Can you master the 8 Hmong tones?</p>
    </div>

    <div class="stats-container">
      <span>Score: <strong id="score">0</strong></span>
      <span>Streak: <strong id="streak">0</strong> 🔥</span>
    </div>

    <div class="word-card" id="wordCard">
      <div class="hmong-word" id="hmongWord">...</div>
      <div class="english-hint" id="englishHint">...</div>
    </div>

    <div class="feedback-area" id="feedback"></div>

    <div class="options-grid" id="optionsGrid"></div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <button class="btn btn-primary next-btn" id="nextBtn" onclick="nextQuestion()">Next Word →</button>
  </div>

  <div class="hmong-border-thick"></div>
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand"><h3>Hmong<span>Heritage</span></h3></div>
      <div class="footer-links">
        <h4>Resources</h4>
        <ul>
          <li><a href="https://www.hmongdictionary.org/" target="_blank" rel="noopener">Hmong Dictionary</a></li>
          <li><a href="https://www.hmonglanguage.com/pronunciation-guide/" target="_blank" rel="noopener">Pronunciation Guide</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom"><p>© 2026 HmongHeritage</p></div>
  </footer>
  <div class="hmong-border"></div>

  <script>
    const tones = [
      { id: 'plain', label: 'Plain', desc: 'No tone' },
      { id: 'h', label: 'H Tone', desc: 'Breathy' },
      { id: 'b', label: 'B Tone', desc: 'Low falling' },
      { id: 'j', label: 'J Tone', desc: 'High rising' },
      { id: 'x', label: 'X Tone', desc: 'Low rising' },
      { id: 'm', label: 'M Tone', desc: 'Glottalized' },
      { id: 's', label: 'S Tone', desc: 'Mid-rising' },
      { id: 'z', label: 'Z Tone', desc: 'High falling' },
    ];

    const words = [
      { word: 'nyuj', meaning: 'dog', tone: 'j' },
      { word: 'ntuj', meaning: 'sky', tone: 'j' },
      { word: 'daj', meaning: 'tall', tone: 'j' },
      { word: 'dawj', meaning: 'cook', tone: 'j' },
      { word: 'haws', meaning: 'open', tone: 's' },
      { word: 'hau', meaning: 'in', tone: 'h' },
      { word: 'hmoob', meaning: 'Hmong', tone: 'h' },
      { word: 'hmab', meaning: 'stump', tone: 'm' },
      { word: 'hmad', meaning: 'burn', tone: 'm' },
      { word: 'hu', meaning: 'call', tone: 'h' },
      { word: 'lus', meaning: 'language', tone: 'b' },
      { word: 'tsob', meaning: 'plant', tone: 'b' },
      { word: 'tsis', meaning: 'not', tone: 'x' },
      { word: 'twg', meaning: 'who', tone: 'x' },
      { word: 'nyuaj', meaning: 'difficult', tone: 'j' },
      { word: 'dav', meaning: 'east', tone: 'b' },
      { word: 'dab', meaning: 'spirit', tone: 'b' },
      { word: 'taub', meaning: 'open', tone: 'b' },
      { word: 'noog', meaning: 'listen', tone: 'b' },
      { word: 'huas', meaning: 'big', tone: 's' },
      { word: 'hais', meaning: 'speak', tone: 's' },
      { word: 'pom', meaning: 'see', tone: 'm' },
      { word: 'ntshai', meaning: 'afraid', tone: 'x' },
      { word: 'siab', meaning: 'heart', tone: 'b' },
      { word: 'siav', meaning: 'yellow', tone: 'x' },
      { word: 'huab', meaning: 'cloud', tone: 'h' },
      { word: 'taug', meaning: 'walk', tone: 'b' },
      { word: 'tug', meaning: 'animal', tone: 'x' },
    ];

    let score = 0, streak = 0, currentIdx = 0;
    const TOTAL_WORDS = 15;

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function loadQuestion() {
      const wordObj = words[currentIdx % words.length];
      document.getElementById('hmongWord').textContent = wordWord = wordObj.word;
      document.getElementById('englishHint').textContent = `"${wordObj.meaning}"`;
      
      const card = document.getElementById('wordCard');
      card.classList.remove('animate-pop');
      void card.offsetWidth; // trigger reflow
      card.classList.add('animate-pop');

      document.getElementById('feedback').textContent = '';
      document.getElementById('nextBtn').style.display = 'none';
      
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      
      // Pick 6 random tones including the correct one
      const correctTone = tones.find(t => t.id === wordObj.tone);
      const otherTones = tones.filter(t => t.id !== wordObj.tone);
      const selection = shuffle(otherTones).slice(0, 5);
      selection.push(correctTone);
      const finalSelection = shuffle(selection);

      finalSelection.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'tone-btn';
        btn.innerHTML = `<span class="tone-label">${t.label}</span><span class="tone-desc">${t.desc}</span>`;
        btn.onclick = () => checkTone(t.id, btn);
        grid.appendChild(btn);
      });

      updateProgress();
    }

    function checkTone(selected, btn) {
      const wordObj = words[currentIdx % words.length];
      const allBtns = document.querySelectorAll('.tone-btn');
      
      if (selected === wordObj.tone) {
        btn.classList.add('correct');
        document.getElementById('feedback').innerHTML = '<span style="color:#22c55e">✨ Correct! +10pts</span>';
        score += 10 + (streak * 2);
        streak++;
        createComboText(btn, `+${10 + (streak * 2)}`);
        
        // Audio Feedback
        playAudio(wordObj.word, 'correct');
      } else {
        btn.classList.add('wrong');
        document.getElementById('feedback').innerHTML = `<span style="color:#ef4444">❌ Incorrect. It was ${tones.find(t=>t.id===wordObj.tone).label}</span>`;
        streak = 0;
        allBtns.forEach(b => {
          if (b.textContent.includes(tones.find(t=>t.id===wordObj.tone).label)) {
            b.classList.add('correct');
          }
        });
        
        // Audio Feedback
        playAudio(null, 'wrong');
      }

      document.getElementById('score').textContent = score;
      document.getElementById('streak').textContent = streak;
      document.getElementById('nextBtn').style.display = 'inline-block';
      
      allBtns.forEach(b => b.disabled = true);
    }

    function playAudio(word, effect) {
      // Try to play word audio if provided
      if (word) {
        const audio = new Audio(`audio/${word.toLowerCase()}.mp3`);
        audio.play().catch(() => console.log('Word audio missing'));
      }
      // Play effect sound
      const effectAudio = new Audio(`audio/sfx/${effect}.mp3`);
      effectAudio.play().catch(() => console.log('SFX missing'));
    }

    function createComboText(btn, text) {
      const rect = btn.getBoundingClientRect();
      const combo = document.createElement('div');
      combo.className = 'combo-text';
      combo.style.left = `${rect.left + rect.width/2}px`;
      combo.style.top = `${rect.top}px`;
      combo.style.transform = 'translateX(-50%)';
      document.body.appendChild(combo);
      combo.textContent = text;
      setTimeout(() => combo.remove(), 800);
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx >= TOTAL_WORDS) {
        alert(`Game Over! Final Score: ${score}`);
        currentIdx = 0;
        score = 0;
        streak = 0;
        document.getElementById('score').textContent = '0';
        document.getElementById('streak').textContent = '0';
      } else {
        loadQuestion();
      }
    }

    function updateProgress() {
      const percent = (currentIdx / TOTAL_WORDS) * 100;
      document.getElementById('progressFill').style.width = `${percent}%`;
    }

    window.onload = () => {
      loadQuestion();
      // Theme sync
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
      }
    };
  </script>
</body>
</html>
