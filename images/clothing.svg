<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a1a2e" rx="12"/>
  <!-- Simplified traditional clothing silhouette -->
  <path d="M70,30 Q70,25 80,25 L120,25 Q130,25 130,30 L140,60 Q145,80 140,100 L145,170 Q145,180 135,180 L65,180 Q55,180 55,170 L60,100 Q55,80 60,60 Z" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <!-- Embroidery patterns -->
  <rect x="75" y="50" width="50" height="8" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="75" y="62" width="50" height="8" fill="none" stroke="#f1c40f" stroke-width="1.5"/>
  <rect x="75" y="74" width="50" height="8" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Center embroidery pattern -->
  <polygon points="100,95 110,105 100,115 90,105" fill="none" stroke="#f1c40f" stroke-width="1.5"/>
  <circle cx="100" cy="105" r="5" fill="#c0392b" opacity="0.6"/>
  <!-- Collar -->
  <path d="M80,25 L90,40 L100,35 L110,40 L120,25" fill="none" stroke="#f1c40f" stroke-width="2"/>
  <!-- Skirt fold lines -->
  <line x1="85" y1="120" x2="85" y2="175" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="120" x2="100" y2="175" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <line x1="115" y1="120" x2="115" y2="175" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <!-- Border pattern -->
  <polyline points="70,160 75,155 80,160 85,155 90,160 95,155 100,160 105,155 110,160 115,155 120,160 125,155 130,160" fill="none" stroke="#c0392b" stroke-width="1.5"/>
</svg>
